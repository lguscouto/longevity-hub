[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "longevidade"
version = "1.4.4"
description = "Longevidade Hub: Plataforma local e auditável de inteligência de saúde, biomarcadores e longevidade."

readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "sqlite-utils>=3.36",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.12.0",
    "jinja2>=3.1.3",
    "Pillow>=10.0.0",
    "openpyxl>=3.1.5",
    "requests>=2.31.0",
    "keyring>=25.0.0",
    "reportlab>=4.0.0",
    "cryptography>=42.0.0",
    "pytest>=8.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
